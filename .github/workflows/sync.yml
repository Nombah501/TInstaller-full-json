name: Sync upstream & translate

on:
  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch:
    inputs:
      force:
        description: "Re-translate everything (ignore cache)"
        type: boolean
        default: false
  push:
    branches: [main, master]
    paths:
      - "scripts/**"
      - ".github/workflows/sync.yml"
      - "requirements.txt"

concurrency:
  group: sync
  cancel-in-progress: false
permissions:
  contents: write
  pages: write
  id-token: write
  issues: write

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install translator deps
        run: pip install -r requirements.txt

      - name: Fetch & incremental translate
        id: sync
        run: |
          if [ "${{ inputs.force }}" = "true" ]; then
            python scripts/sync.py --force
          else
            python scripts/sync.py
          fi

      - name: Fallback to snapshot if upstream unreachable
        if: failure() && steps.sync.outcome == 'failure'
        run: |
          echo "Upstream fetch failed, rebuilding from last snapshot..."
          python scripts/sync.py --upstream data/upstream_snapshot.json
          echo "Fallback succeeded, will commit snapshot-based rebuild"

      - name: Check for changes
        id: changes
        run: |
          git diff --quiet -- 1.json ru.json data/translation_cache.json data/upstream_snapshot.json && echo "changed=false" >> $GITHUB_OUTPUT || echo "changed=true" >> $GITHUB_OUTPUT
          git status --short
          echo "--- stats ---"
          python3 -c "import json; d=json.load(open('1.json')); print(f\"apps: {len(d['apps'])}\"); c=json.load(open('data/translation_cache.json')); print(f\"cache: {len(c['texts'])} entries\")"

      - name: t.ly healthcheck (browser UA)
        continue-on-error: true
        run: |
          echo "Checking https://t.ly/69_C_ ..."
          FINAL=$(curl -sL -A "Mozilla/5.0 (Linux; Android 11; AFTSSS) AppleWebKit/537.36" -o /tmp/tly.json -w "%{url_effective}" https://t.ly/69_C_ || true)
          echo "Final URL: $FINAL"
          if ! echo "$FINAL" | grep -q "nombah501.github.io/TInstaller-full-json/1.json"; then
            echo "::warning::t.ly did not redirect to expected Pages URL (got $FINAL) — check https://t.ly/69_C_ manually"
          else
            python3 -c "import json; d=json.load(open('/tmp/tly.json')); print(f\"t.ly OK: {len(d['apps'])} apps\")" 2>&1 || echo "::warning::t.ly returned non-JSON (likely Cloudflare challenge in CI) — check manually, but not failing workflow"
          fi
      - name: Commit & push
        if: steps.changes.outputs.changed == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add 1.json ru.json data/translation_cache.json data/upstream_snapshot.json
          COUNT=$(python3 -c "import json; print(len(json.load(open('1.json'))['apps']))")
          git commit -m "sync: update RU fork from upstream (${COUNT} apps) [skip ci]"
          # Rebase in case of concurrent push — fail explicitly if all retries exhausted
          pushed=false
          for i in 1 2 3; do
            if git pull --rebase origin ${{ github.ref_name }} && git push; then pushed=true; break; fi
            echo "push attempt $i failed, retrying..."
            sleep 2
          done
          if [ "$pushed" != "true" ]; then echo "::error::git push failed after 3 attempts"; exit 1; fi

      - name: No changes
        if: steps.changes.outputs.changed == 'false'
        run: echo "No changes — upstream and translations are up to date."

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: "."

      - name: Notify on failure
        if: failure()
        run: |
          echo "::warning::Sync failed — check https://github.com/${{ github.repository }}/actions"
          # Create an issue for visibility (no secret needed, uses GITHUB_TOKEN)
          gh api repos/${{ github.repository }}/issues -f title="Sync failed: ${{ github.run_id }}" -f body="Run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}" 2>&1 | head -5 || true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  deploy:
    needs: sync
    runs-on: ubuntu-latest
    if: needs.sync.result == 'success'
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
